name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Lint with flake8
      run: |
        uv run flake8 mlai/ --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 mlai/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
