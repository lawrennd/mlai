[project]
name = "mlai"
version = "0.1.3"
description = "Package of simple models and plotting routines for teaching and lecturing about machine learning."
authors = [
    { name = "Neil D. Lawrence", email = "lawrennd@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "pods",
    "pandas",
    "matplotlib",
    "IPython",
    "scipy",
]

[project.optional-dependencies]
graphical-models = ["daft-pgm"]
mountain-car = ["GPy"]
gp-tutorials = ["GPy"]

[project.urls]
Homepage = "https://github.com/lawrennd/mlai"
Repository = "https://github.com/lawrennd/mlai"

[dependency-groups]
dev = [
    "sphinx>=8.2.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
    "sphinx-autodoc-typehints>=3.2.0,<4",
    "myst-parser>=4.0.1,<5",
    "pytest>=8.0.0,<9",
    "pytest-cov>=5.0.0,<6",
    "pytest-benchmark>=4.0.0,<5",
    "hypothesis>=6.100.0,<7",
    "daft-pgm>=0.1.0,<0.2",
    "ruff>=0.9.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# Default `ruff check` is the CI hard-fail gate, matching the former flake8
# select E9,F63,F7,F82. The advisory pass overrides this select on the CLI.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlai"]

[tool.hatch.build.targets.sdist]
include = [
    "/mlai",
    "/README.md",
]
